services:

  # ─────────────────────────────────────────
  #  Databáze MariaDB LTS
  # ─────────────────────────────────────────
  mariadb:
    image: mariadb:11.4
    container_name: kotouc_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: kotouc_root_2024
      MARIADB_DATABASE: kotouc_manager
      MARIADB_USER: kotouc_user
      MARIADB_PASSWORD: kotouc_pass_2024
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql    # Samostatný datový svazek pro MariaDB
    ports:
      - "3307:3306"                    # Port 3307 na PC → 3306 uvnitř Dockeru
                                       # (aby nekolidovalo s případnou lokální databází na 3306)
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ─────────────────────────────────────────
  #  Backend FastAPI
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kotouc_backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy      # Počká, až MariaDB bude připravena
    environment:
      DB_HOST: mariadb                  # Název služby výše = hostname uvnitř Dockeru
      DB_PORT: 3306
      DB_USER: kotouc_user
      DB_PASSWORD: kotouc_pass_2024
      DB_NAME: kotouc_manager
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Nastav ADMIN_PASSWORD v kořenovém .env souboru (alespoň 10 znaků)}
    ports:
      - "8000:8000"

  # ─────────────────────────────────────────
  #  Frontend React (Nginx)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kotouc_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"                       # http://localhost:5173 → Nginx uvnitř

volumes:
  mariadb_data:                         # Pojmenovaný volume = data zůstanou i po docker-compose down
